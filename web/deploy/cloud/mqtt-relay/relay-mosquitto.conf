# ==============================================================================
# ECAS 浓度计 · MQTT 转发机（relay）—— 只转发，不落任何数据
#
#   2026-09-28 安全审查 H-01 处置（先生令「立刻按照建议解决」；原话：
#   「H01暂时无法解决明文问题，所以单独采用1台服务器做数据转发，不直接触碰原始数据」）
#   现场 DTU（塔石 TAS-KS-301）只会明文 MQTT、无法上传 CA ⇒ DTU 侧开不了 TLS，
#   于是把「接受明文」这件事从持有数据的 broker 上摘出来，交给本实例：
#
#     现场 DTU --明文 8883--> [relay：无持久化 / 无本地订阅者] --TLS 8884--> 主 broker
#                                                                          └→ 采集器（TLS 8884）
#
#   本实例的硬性质：
#     · persistence false / autosave_interval 0  —— 不写盘，重启不保留任何数据
#     · cleansession true                        —— 桥接不保留离线会话
#     · queue_qos0_messages false / max_queued_messages 100 —— 内存中最多压 100 条
#     · 只有 8883 一个监听，ACL 默认拒绝且仅 dpro66-dtu 可写 dpro66
#
#   ⚠️ 本文件由 web/deploy/cloud/deploy-cloud-mqtt-relay.sh 渲染后安装到
#      /etc/mosquitto/relay/relay.conf；直接改服务器上的文件会被下次部署覆盖。
# ==============================================================================

listener 8883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/relay/passwd
acl_file /etc/mosquitto/relay/acl.conf

# —— 不落任何数据 ——
persistence false
autosave_interval 0
queue_qos0_messages false
max_queued_messages 100
max_inflight_messages 20

# —— 独立日志（与主 broker 的 /var/log/mosquitto/mosquitto.log 分开）——
log_dest file /var/log/mosquitto/relay.log
log_type error
log_type warning
log_type notice
log_type information

# —— 到主 broker 的桥接：TLS + 专用最小权限账号，只桥 dpro66 一个主题（方向 out = 本机→主）——
connection ecas-main
address __MAIN_BROKER__
bridge_cafile __CAFILE__
bridge_insecure false
bridge_tls_version tlsv1.2
remote_username __BRIDGE_USER__
remote_password __BRIDGE_PASSWORD__
cleansession true
notifications false
restart_timeout 5 30
topic dpro66 out 1
