# ============================================================================
# ECAS 公网边缘（腾讯云 124.222.122.146）—— nginx **跳转器**（不再反代）
# 由 web/deploy/cloud/deploy-cloud-edge.sh 渲染后装进容器：/etc/nginx/conf.d/default.conf
# 渲染占位符：__PUBLIC_IP__ / __PUBLIC_HOST__ / __CERT__ / __KEY__
#
# 设计要点（2026-09-28 安全审查 H-03 / M-01 / M-02 后改）：
#   1. 正经入口是 https://__PUBLIC_HOST__（Cloudflare → Worker `gateway` → 隧道/VPC → mesh），
#      本机 443 不再是业务入口 ⇒ 从这里打不进任何数据面，也不再泄露 /docs /openapi.json；
#   2. 80 与 443 一律 301 跳到正式域名；只留一个**本地 /healthz** 给 compose 健康检查
#      （健康检查不能依赖外网）；
#   3. 自签证书只出现在「跳转前那一次 TLS 握手」里，且**不开 HSTS**——HSTS 由正式域名
#      那侧下发（见 Worker 的 secHeaders()）；
#   4. __UPSTREAM__（mesh 的 10.10.10.11:18080）已从本文件移除：公网不再有一条直通
#      业务后端的路径；本文件里的 /ws/、/api/*、/internal/*、/docs 都只跳转。
# ============================================================================

# 不记录查询串：旧行为里令牌可能经 ?token= 传递
log_format ecas '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;

    access_log /var/log/nginx/ecas-access.log ecas;

    # 留给将来「有域名 → Let's Encrypt」时的 webroot 校验通道
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 明文只做跳转，不落令牌
    location / {
        return 301 https://__PUBLIC_HOST__$request_uri;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;

    # 自签证书（SAN 含公网 IP 与 mesh IP）；已不从本机提供业务，留着只为握手后跳转
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ecas-ssl:10m;
    ssl_session_timeout 1h;

    # 自签阶段**不开 HSTS**：否则浏览器会把「证书不受信」钉死一段时间；
    # 正式域名（__PUBLIC_HOST__）那侧的 HSTS 由 Worker 下发，与本文件无关。
    # add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/ecas-access.log ecas;
    client_max_body_size 4m;

    # 本地健康检查（容器 healthcheck：wget --no-check-certificate https://127.0.0.1/healthz）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 其余一切（含 /ws/、/api/*、/internal/*、/docs、/openapi.json）都不再反代，只指路
    location / {
        return 301 https://__PUBLIC_HOST__$request_uri;
    }
}
