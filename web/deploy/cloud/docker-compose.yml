# ============================================================================
# ECAS 公网边缘（腾讯云 124.222.122.146）—— nginx 反向代理容器
# 部署位置：/opt/ecas-edge/   部署脚本：web/deploy/cloud/deploy-cloud-edge.sh
#
# 为什么用容器：这台云主机是 OpenCloudOS 9.4（RHEL 系，只有 dnf），
#               仓库里没有 nginx 包，容器方式反而干净且可一键重放。
# 出口：https://124.222.122.146/  →  http://10.10.10.11:18080 （Ubuntu 测试栈，全程走 mesh 隧道）
#
# network_mode: host —— 直绑宿主 80/443，且访问日志里是真实客户端 IP（不走 docker NAT）
# ============================================================================
services:
  edge:
    image: ${EDGE_IMAGE:-nginx:1.27-alpine}
    container_name: ecas-edge
    network_mode: host
    restart: unless-stopped
    volumes:
      # 反向代理配置（仓库里渲染好后推上来），覆盖镜像自带的 default.conf
      - ./nginx/ecas-edge.conf:/etc/nginx/conf.d/default.conf:ro
      # 自签证书；将来换 Let's Encrypt 只改配置里的两行路径
      - ./ssl:/etc/nginx/ssl:ro
      # 访问日志落宿主目录，方便排查（日志格式已剥离查询串，不落令牌）
      - ./logs:/var/log/nginx
      # 将来有域名时 ACME 校验用
      - ./acme:/var/www/certbot
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
